<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kraków Sponge: where the city's water starts</title>
    <meta name="description" content="Mapping drainage ditches, river corridors and the 2026 drought in the Rudawa, Prądnik and Dłubnia catchments that feed Kraków." />
    <meta name="theme-color" content="#0b2545" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kraków Sponge" />
    <meta property="og:title" content="Kraków Sponge: the city's water starts in the hills around it" />
    <meta property="og:description" content="2026 drought dashboard and retention map for the Rudawa, Prądnik and Dłubnia catchments that feed Kraków's rivers and tap water. Live IMGW gauges, ditch priorities, LiDAR, citizen reports." />
    <meta property="og:url" content="https://piotrnowakowski.github.io/Krakow_sponge_around_city/" />
    <meta property="og:image" content="https://piotrnowakowski.github.io/Krakow_sponge_around_city/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Map of the Rudawa, Prądnik and Dłubnia catchments around Kraków with drought statistics" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kraków Sponge: the city's water starts in the hills around it" />
    <meta name="twitter:description" content="2026 drought dashboard and retention map for the rivers that feed Kraków." />
    <meta name="twitter:image" content="https://piotrnowakowski.github.io/Krakow_sponge_around_city/og.png" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>" />
  </head>
  <body>
    <a class="skip" href="#sidebar" data-i18n="skip"></a>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><path d="M16 3C11 10 7 14.5 7 19.5a9 9 0 0 0 18 0C25 14.5 21 10 16 3z" fill="#1f78b4"/><path d="M11 20c1.5 2.5 3.5 3.5 6 3.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </span>
        <div>
          <h1 data-i18n="title"></h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="tour-btn" id="tour-btn"><span aria-hidden="true">▶</span> <span data-i18n="tour_btn"></span></button>
        <div class="lang" role="group" aria-label="Language / Język">
          <button data-lang="en" type="button">EN</button>
          <button data-lang="pl" type="button">PL</button>
        </div>
        <a class="gh" href="https://github.com/piotrnowakowski/Krakow_sponge_around_city" target="_blank" rel="noopener">GitHub</a>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="sidebar" tabindex="-1">
        <button type="button" class="mobile-sheet-toggle" id="mobile-sheet-toggle" aria-expanded="false" aria-controls="mobile-sheet-content">
          <span class="sheet-handle" aria-hidden="true"></span>
          <span><strong id="mobile-sheet-title" data-i18n="mobile_explore"></strong><small id="mobile-sheet-subtitle" data-i18n="mobile_explore_hint"></small></span>
          <span class="sheet-chevron" aria-hidden="true">⌃</span>
        </button>
        <div id="mobile-sheet-content" class="sheet-content">
        <div id="mobile-menu" class="mobile-menu">
          <button type="button" data-mobile-tab="layers" data-i18n="tab_layers"></button>
          <button type="button" data-mobile-tab="catchments" data-i18n="tab_catchments"></button>
          <button type="button" data-mobile-tab="drought" data-i18n="tab_drought"></button>
          <button type="button" data-mobile-tab="reports" data-i18n="mobile_saved_reports"></button>
          <button type="button" data-mobile-tab="about" data-i18n="tab_about"></button>
          <button type="button" id="mobile-tour" data-i18n="mobile_story"></button>
        </div>
        <nav class="tabs" role="tablist">
          <button role="tab" id="tab-layers" aria-controls="panel-layers" data-tab="layers" class="active" data-i18n="tab_layers"></button>
          <button role="tab" id="tab-catchments" aria-controls="panel-catchments" data-tab="catchments" data-i18n="tab_catchments"></button>
          <button role="tab" id="tab-drought" aria-controls="panel-drought" data-tab="drought" data-i18n="tab_drought"></button>
          <button role="tab" id="tab-reports" aria-controls="panel-reports" data-tab="reports" data-i18n="tab_reports"></button>
          <button role="tab" id="tab-about" aria-controls="panel-about" data-tab="about" data-i18n="tab_about"></button>
        </nav>
        <section class="panel active" id="panel-layers" role="tabpanel" aria-labelledby="tab-layers" tabindex="0"></section>
        <section class="panel" id="panel-catchments" role="tabpanel" aria-labelledby="tab-catchments" tabindex="0"></section>
        <section class="panel" id="panel-drought" role="tabpanel" aria-labelledby="tab-drought" tabindex="0"></section>
        <section class="panel" id="panel-reports" role="tabpanel" aria-labelledby="tab-reports" tabindex="0"></section>
        <section class="panel" id="panel-about" role="tabpanel" aria-labelledby="tab-about" tabindex="0"></section>
        </div>
      </aside>

      <div class="map-wrap">
        <div id="map"></div>
        <label class="mobile-basemap"><span class="sr-only" data-i18n="mobile_basemap"></span><select id="mobile-basemap">
          <option value="light" data-i18n="bm_light"></option>
          <option value="ortho" data-i18n="bm_ortho"></option>
          <option value="relief" data-i18n="bm_relief"></option>
        </select></label>
        <div class="basemaps" role="group" aria-label="Basemap / Podkład">
          <button data-basemap="light" class="active" data-i18n="bm_light"></button>
          <button data-basemap="ortho" data-i18n="bm_ortho"></button>
          <button data-basemap="relief" data-i18n="bm_relief"></button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="focus-bar" id="focus-bar" hidden aria-live="polite"></div>
        <button type="button" class="report-fab" id="report-fab"><span aria-hidden="true">＋</span> <span data-i18n="rep_fab"></span></button>
        <div class="pick-bar" id="pick-bar" role="status" hidden></div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
        <section class="tour" id="tour" role="dialog" aria-labelledby="tour-title" hidden></section>
        <div class="tour-invite" id="tour-invite" role="status" hidden></div>
        <div class="loading" id="loading" data-i18n="loading"></div>
      </div>
    </main>

    <nav class="mobile-nav" aria-label="Mobile">
      <button type="button" id="mobile-map" aria-current="page"><span aria-hidden="true">◫</span><span data-i18n="bm_light"></span></button>
      <button type="button" id="mobile-report"><span class="mobile-add" aria-hidden="true">＋</span><span data-i18n="tab_reports"></span></button>
      <button type="button" id="mobile-more"><span aria-hidden="true">•••</span><span data-i18n="mobile_more"></span></button>
    </nav>

    <dialog id="report-dialog" aria-labelledby="rd-title"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
