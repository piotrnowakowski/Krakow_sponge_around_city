name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *" # daily refresh of the drought data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache IMGW archive and ERA5 downloads
        uses: actions/cache@v4
        with:
          path: |
            data/raw/imgw
            data/raw/climate
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Refresh drought data
        # Keep the committed snapshot if IMGW or Open-Meteo is unreachable.
        continue-on-error: true
        run: |
          pip install -r pipeline/requirements-drought.txt
          cd pipeline && python drought.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run test:ditch-barriers
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
